name: Finance API CI/CD

on:
  push:
    branches: [ "main", "develop" ]
    paths:
      - 'ms-finance-api/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'ms-finance-api/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilar e Rodar Testes com Maven
        run: mvn clean test
        working-directory: ./ms-finance-api

      - name: Gerar jar
        run: mvn clean package -DskipTests
        working-directory: ./ms-finance-api

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Gerar jar
        run: mvn clean package -DskipTests
        working-directory: ./ms-finance-api

      - name: Copiar jar pro EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: ms-finance-api/target/ms-finance-api-0.0.1-SNAPSHOT.jar
          target: /home/ec2-user/

      - name: Reiniciar serviço no EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script: sudo systemctl restart ms-finance-api